# Samba pe hostul canary: NU are nimic real pe el. Fiecare citire e o alerta.
[global]
   workgroup = WORKGROUP
   server string = DiskStation
   netbios name = DISKSTATION
   server role = standalone server
   # NBNS (137/138) il tine responderul nostru din canaryd; nmbd rămâne oprit
   disable netbios = yes
   smb ports = 445 139
   security = user
   map to guest = Bad User
   guest account = nobody
   server min protocol = NT1
   log file = /var/log/samba/log.%m
   max log size = 1000
   logging = file
   # auditul: prefix "IP|utilizator|share", apoi operatia si fisierul, in syslog local5
   vfs objects = full_audit
   full_audit:prefix = %I|%u|%S
   full_audit:success = open openat pread read
   full_audit:failure = none
   full_audit:facility = local5
   full_audit:priority = NOTICE

[Backup]
   comment = Backup configuratii
   path = /srv/momeala/backup
   browseable = yes
   read only = yes
   guest ok = yes

[Documente]
   comment = Documente interne
   path = /srv/momeala/documente
   browseable = yes
   read only = yes
   guest ok = yes
