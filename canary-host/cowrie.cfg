# Doar suprascrierile noastre; restul vine din src/cowrie/data/etc/cowrie.cfg.dist
# Se pune in /opt/cowrie/etc/cowrie.cfg
[honeypot]
hostname = DiskStation
sensor_name = diskstation-canary
auth_class = UserDB
ttylog = true
interactive_timeout = 600

[ssh]
enabled = true
listen_endpoints = tcp:22:interface=0.0.0.0
version = SSH-2.0-OpenSSH_8.2p1

[telnet]
enabled = true
listen_endpoints = tcp:23:interface=0.0.0.0

[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.json
